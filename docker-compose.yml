services:
  safescanarr:
    build: .
    container_name: safescanarr
    restart: unless-stopped
    ports:
      - "8666:8666"
    volumes:
      # Persistent data (db, logs, contact sheets)
      - ./data:/opt/safescanarr/data
      # Media folders — uncomment and update paths as needed
      # - /path/to/your/media:/mnt/media
    environment:
      - BASE_DIR=/opt/safescanarr/data
      - WEB_PORT=8666
      # Bind inside the container so the published port stays reachable from the
      # LAN. The host default (127.0.0.1) deliberately does not expose the UI.
      - WEB_HOST=0.0.0.0
      # On first run, open the web UI and complete setup to choose password or
      # token auth. If you prefer to manage auth via env, uncomment and set one:
      # - SS_TOKEN=change-me
      # - SS_PASSWORD_HASH=$2b$...  # use python3 -m web.authtool set-password
