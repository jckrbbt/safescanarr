<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Safe Scanarr</title>
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
  <nav class="navbar">
    <div class="nav-brand">
      <span class="nav-logo">🛡️</span>
      <span class="nav-title">Safe Scanarr</span>
      <span class="nav-version" id="nav-version"></span>
    </div>
    <div class="nav-links">
      <a href="#" class="nav-link active" data-page="review">Review</a>
      <a href="#" class="nav-link" data-page="config">Config</a>
      <a href="#" class="nav-link" data-page="database">Database</a>
      <a href="#" class="nav-link" data-page="logs">Logs</a>
    </div>
  </nav>

  <main class="main">

    <!-- ── REVIEW ──────────────────────────────────────────────── -->
    <div id="page-review" class="page active">
      <div class="page-header">
        <h1>Review Sheets</h1>
        <div class="header-actions">
          <span id="review-count" class="badge"></span>
          <button class="btn btn-primary" onclick="triggerScan()">▶ Run Scan Now</button>
          <button class="btn btn-secondary" onclick="loadSheets()">↻ Refresh</button>
        </div>
      </div>

      <!-- Search + bulk toolbar -->
      <div class="review-toolbar">
        <input type="text" id="review-search" class="input-search" placeholder="🔍 Search sheets…" oninput="filterSheets()">
        <div class="bulk-actions" id="bulk-actions" style="display:none">
          <span id="selected-count" class="badge"></span>
          <button class="btn btn-success btn-sm" onclick="bulkReviewed()">✓ Mark Reviewed</button>
          <button class="btn btn-danger btn-sm" onclick="confirmBulkDelete()">🗑 Delete Media</button>
          <button class="btn btn-secondary btn-sm" id="bulk-select-all" onclick="toggleSelectAll()" style="display:none">☑ Select All</button>
          <button class="btn btn-secondary btn-sm" onclick="clearSelection()">✕ Deselect</button>
        </div>
        <label class="select-all-label">
          <input type="checkbox" id="select-all" onchange="toggleSelectAll()"> Select all
        </label>
      </div>

      <div id="sheets-empty" class="empty-state" style="display:none">
        <p>🎉 Nothing to review!</p>
      </div>
      <div id="sheets-grid" class="sheets-grid"></div>
    </div>

    <!-- ── CONFIG ──────────────────────────────────────────────── -->
    <div id="page-config" class="page">
      <div class="page-header">
        <div class="header-left">
          <h1>Configuration</h1>
          <button class="btn btn-primary" onclick="saveConfig()">💾 Save</button>
        </div>
      </div>
      <div id="config-msg" class="msg" style="display:none"></div>
      <div class="config-form">

        <section class="config-section">
          <h2>Watch Folders</h2>
          <p class="hint">One folder per line. Only media in these folders will be processed.</p>
          <textarea id="cfg-watch-folders" rows="4" class="input-full"></textarea>
        </section>

        <section class="config-section">
          <h2>Output</h2>
          <label>Contact Sheet Output Directory</label>
          <input type="text" id="cfg-output-dir" class="input-full">
        </section>

        <section class="config-section">
          <h2>Sonarr</h2>
          <label>URL</label>
          <input type="text" id="cfg-sonarr-url" class="input-full">
          <label>API Key</label>
          <div class="input-row">
            <input type="text" id="cfg-sonarr-key" class="input-full">
            <button class="btn btn-secondary" onclick="testConnection('sonarr')" id="test-sonarr-btn">Test</button>
          </div>
          <div id="test-sonarr-result" class="test-result"></div>
        </section>

        <section class="config-section">
          <h2>Radarr</h2>
          <label>URL</label>
          <input type="text" id="cfg-radarr-url" class="input-full">
          <label>API Key</label>
          <div class="input-row">
            <input type="text" id="cfg-radarr-key" class="input-full">
            <button class="btn btn-secondary" onclick="testConnection('radarr')" id="test-radarr-btn">Test</button>
          </div>
          <div id="test-radarr-result" class="test-result"></div>
        </section>

        <section class="config-section">
          <h2>Poller</h2>
          <label>Poll Interval (seconds)</label>
          <input type="number" id="cfg-poll-interval" class="input-short" min="60">
        </section>

        <section class="config-section">
          <h2>vcsi</h2>
          <label>Grid Size (e.g. 4x4)</label>
          <input type="text" id="cfg-vcs-grid" class="input-short">
          <label>vcsi Timeout (seconds)</label>
          <input type="number" id="cfg-vcsi-timeout" class="input-short" min="30">
        </section>

      </div>
    </div>

    <!-- ── DATABASE ────────────────────────────────────────────── -->
    <div id="page-database" class="page">
      <div class="page-header">
        <h1>Database</h1>
        <div class="header-actions">
          <div id="db-stats" class="db-stats"></div>
          <input type="text" id="db-search" placeholder="Search path…" class="input-search" oninput="loadDb()">
          <select id="db-status-filter" class="select" onchange="loadDb()">
            <option value="">All</option>
            <option value="ok">OK</option>
            <option value="error">Errors</option>
          </select>
        </div>
      </div>
      <div class="table-wrap">
        <table class="db-table">
          <thead>
            <tr>
              <th>Status</th>
              <th>Filename</th>
              <th>Path</th>
              <th>Last Updated</th>
            </tr>
          </thead>
          <tbody id="db-tbody"></tbody>
        </table>
      </div>
      <div class="pagination" id="db-pagination"></div>
    </div>

    <!-- ── LOGS ────────────────────────────────────────────────── -->
    <div id="page-logs" class="page">
      <div class="page-header">
        <h1>Logs</h1>
        <div class="header-actions">
          <select id="log-level" class="select" onchange="loadLogs()">
            <option value="">All</option>
            <option value="ERROR">Errors only</option>
            <option value="INFO">Info+</option>
          </select>
          <input type="number" id="log-lines" value="200" min="50" max="2000" class="input-short" onchange="loadLogs()">
          <button class="btn btn-secondary" onclick="loadLogs()">↻ Refresh</button>
        </div>
      </div>
      <div id="log-output" class="log-output"></div>
    </div>

  </main>

  <!-- ── MODAL ───────────────────────────────────────────────── -->
  <div id="modal-overlay" class="modal-overlay" style="display:none">
    <div class="modal">
      <h2 id="modal-title"></h2>
      <p id="modal-body"></p>
      <div class="modal-actions">
        <button class="btn btn-danger" id="modal-confirm">Confirm</button>
        <button class="btn btn-secondary" onclick="closeModal()">Cancel</button>
      </div>
    </div>
  </div>

  <div id="toast" class="toast" style="display:none"></div>
  <script src="/static/app.js"></script>
</body>
</html>
